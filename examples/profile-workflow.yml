name: Update XLK status GIF

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: <your-username>/finance-animation@main
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/xlk-status.gif assets/xlk-state.json
          git diff --cached --quiet || (git commit -m "chore: update XLK status GIF" && git push)